<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021412" />
      <stop offset="50%" stop-color="#042621" />
      <stop offset="100%" stop-color="#010e0c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4aa" />
      <stop offset="100%" stop-color="#007cf0" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083832" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#041f1b" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Wave & Grid Lines -->
  <path d="M 0,220 C 300,180 600,140 900,190 C 1050,215 1150,240 1200,250 L 1200,0 L 0,0 Z" fill="#052c26" opacity="0.45" />
  <path d="M 0,260 C 350,220 700,170 1000,230 C 1120,250 1180,270 1200,280" stroke="#00d4aa" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M 0,300 C 350,260 700,210 1000,270 C 1120,290 1180,310 1200,320" stroke="#2dd4bf" stroke-width="1.5" fill="none" opacity="0.2" />

  <!-- Logo Badge -->
  <rect x="100" y="100" width="80" height="80" rx="20" fill="url(#accentGrad)" />
  <path d="M 120 150 L 136 130 L 150 140 L 166 116 L 174 122" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="174" cy="122" r="4.5" fill="#ffffff"/>

  <!-- Brand Title -->
  <text x="200" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" fill="#ffffff">
    Predi<tspan fill="url(#mintGrad)">Folio</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">
    Stock Portfolio &amp; Sell Prediction Tracker
  </text>
  <text x="100" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Indian Equities (NSE / BSE) • Real-Time Valuation • Intelligent Target Forecaster
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 340)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#0d5c53" stroke-width="1.5"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2dd4bf">📊 Live NSE/BSE Prices</text>

    <!-- Pill 2 -->
    <rect x="236" y="0" width="240" height="48" rx="24" fill="url(#cardGrad)" stroke="#0d5c53" stroke-width="1.5"/>
    <text x="260" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2dd4bf">🎯 Multi-Sell Targets</text>

    <!-- Pill 3 -->
    <rect x="492" y="0" width="240" height="48" rx="24" fill="url(#cardGrad)" stroke="#0d5c53" stroke-width="1.5"/>
    <text x="516" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2dd4bf">🌐 3D Interactive Charts</text>

    <!-- Pill 4 -->
    <rect x="748" y="0" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#0d5c53" stroke-width="1.5"/>
    <text x="772" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#2dd4bf">🖐️ Drag &amp; Drop Cards</text>
  </g>

  <!-- Visual Card Mockup on Right -->
  <g transform="translate(760, 110)">
    <rect x="0" y="0" width="340" height="180" rx="20" fill="url(#cardGrad)" stroke="#0d5c53" stroke-width="2" filter="drop-shadow(0 12px 30px rgba(0,0,0,0.5))"/>
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">RELIANCE</text>
    <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Reliance Industries Ltd</text>

    <text x="24" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">₹2,980.50</text>
    <text x="180" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#00e676">+4.82% ▲</text>

    <rect x="24" y="135" width="292" height="28" rx="6" fill="#062e28"/>
    <text x="36" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">Target: ₹3,400.00 • Expected: +14.07%</text>
  </g>

  <!-- Footer Link -->
  <text x="100" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#64748b">
    https://predifolio.netlify.app
  </text>
</svg>
